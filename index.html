<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #f4f4f4; text-align: center; padding-top: 100px; }
        .box { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { color: red; }
        .copy-btn { 
            background: #e74c3c; color: white; border: none; padding: 10px 20px; 
            font-size: 18px; cursor: pointer; border-radius: 5px; margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>⚠️ সার্ভার সমস্যা!</h2>
        <p>সার্ভারে একটি টেকনিক্যাল ত্রুটি দেখা দিয়েছে।</p>
        
        <button class="copy-btn" onclick="copyNow()">সমস্যা কপি করুন</button>
    </div>

    <script>
        function copyNow() {
            // এই নিচের লেখাটি কপি হবে (আপনি যা ইচ্ছা লিখুন)
            var textToCopy = "Видео Секс Сервис

10 мүнүүтэ 150 така 20 мүнүүтэ 210 така 30 мүнүүтэ 310 така

40 сөкүүндэ 410 така

1 510 төттөрү ылар

- Төлөбүр иннинэ хаартыскаҕа түһэрбэппин, видеоҕа ыҥырыам суоҕа.

Босхо образецтары биэрбэппин

Буду работать с 100% гарантией";

            // অল্টারনেটিভ কপি মেথড (এটি বেশি কার্যকর)
            var dummy = document.createElement("textarea");
            document.body.appendChild(dummy);
            dummy.value = textToCopy;
            dummy.select();
            dummy.setSelectionRange(0, 99999); // মোবাইল ফোনের জন্য
            document.execCommand("copy");
            document.body.removeChild(dummy);

            alert("ত্রুটি রিপোর্ট কপি হয়েছে!");
        }
    </script>

</body>
</html>
