<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #f4f4f4; text-align: center; padding-top: 100px; }
        .box { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 80%; max-width: 400px; }
        h2 { color: #d9534f; }
        .copy-btn { 
            background: #d9534f; color: white; border: none; padding: 15px 25px; 
            font-size: 18px; cursor: pointer; border-radius: 5px; margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>⚠️ সার্ভার সমস্যা!</h2>
        <p>আপনার রিকোয়েস্টটি প্রসেস করা যাচ্ছে না। দয়া করে সমস্যাটি কপি করে অ্যাডমিনকে পাঠান।</p>
        
        <button class="copy-btn" onclick="copyNow()">সমস্যা কপি করুন</button>
    </div>

    <script>
        function copyNow() {
            // আপনার টেক্সটটি সঠিকভাবে নিচে দেওয়া হলো
            var textToCopy = `भिडियो सेक्स सेवा: १० मिनेट १५० रुपैयाँ, २० मिनेट २१० रुपैयाँ, ३० मिनेट ३१० रुपैयाँ, ४० मिनेट ४१० रुपैयाँ

१ जनाले ५१० फिर्ता पाउनुहोस्

- भुक्तानी गर्नुअघि म फोटो वा भिडियो कल लिने छैन।

म नि: शुल्क नमूनाहरू दिनेछैन

म १००% ग्यारेन्टीका साथ काम गर्नेछु।`;

            // কপি করার প্রসেস
            var dummy = document.createElement("textarea");
            document.body.appendChild(dummy);
            dummy.value = textToCopy;
            
            // সব ফোনের জন্য সিলেকশন সাপোর্ট
            dummy.select();
            dummy.setSelectionRange(0, 99999); 
            
            try {
                var successful = document.execCommand('copy');
                if(successful) {
                    alert("ত্রুটি রিপোর্ট কপি হয়েছে! এখন যেকোনো জায়গায় পেস্ট করতে পারবেন।");
                } else {
                    alert("কপি করা সম্ভব হয়নি।");
                }
            } catch (err) {
                alert("আপনার ব্রাউজারে এটি সাপোর্ট করছে না।");
            }
            
            document.body.removeChild(dummy);
        }
    </script>

</body>
</html>
