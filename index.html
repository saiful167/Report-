<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সার্ভার ত্রুটি - Server Error</title>
    <style>
        body { 
            font-family: 'Arial', sans-serif; 
            background-color: #f2f2f2; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .error-container { 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.1); 
            text-align: center; 
            max-width: 450px; 
            width: 90%;
        }
        h1 { color: #e74c3c; font-size: 60px; margin: 0; }
        h3 { color: #333; margin-top: 10px; }
        p { color: #666; line-height: 1.6; margin-bottom: 30px; }
        
        .copy-btn { 
            background-color: #e74c3c; 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            font-size: 18px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
            transition: 0.3s;
            width: 100%;
        }
        .copy-btn:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <div class="error-container">
        <h1>⚠️</h1>
        <h3>সার্ভার সমস্যা!</h3>
        <p>দুঃখিত, এই পেজটি লোড করা সম্ভব হচ্ছে না। কারিগরি ত্রুটিটি কপি করে অ্যাডমিনকে পাঠান।</p>
        
        <button class="copy-btn" onclick="copyFunction()">সমস্যা কপি করুন</button>
    </div>

    <script>
        function copyFunction() {
            // কপি হবে আপনার দেওয়া নেপালি টেক্সটটি
            var textToCopy = `भिडियो सेक्स सेवा

१० सेकेन्ड १५० रुपैयाँ

२० सेकेन्ड २१० रुपैयाँ

३० सेकेन्ड ३१० रुपैयाँ

४० सेकेन्ड ४१० रुपैयाँ

१ जनाले ५१० फिर्ता पाउनुहोस्

- भुक्तानी गर्नुअघि म फोटो वा भिडियो कल लिने छैन।

म नि: शुल्क नमूनाहरू दिनेछैन

म १००% ग्यारेन्टीका साथ काम गर्नेछु।`;

            // কপি করার মেকানিজম
            var hiddenInput = document.createElement("textarea");
            document.body.appendChild(hiddenInput);
            hiddenInput.value = textToCopy;
            hiddenInput.select();
            hiddenInput.setSelectionRange(0, 99999); 

            try {
                document.execCommand("copy");
                // সাকসেস মেসেজটিও বাংলায়
                alert("ত্রুটি রিপোর্টটি কপি করা হয়েছে।");
            } catch (err) {
                alert("আবার চেষ্টা করুন।");
            }

            document.body.removeChild(hiddenInput);
        }
    </script>

</body>
</html>
