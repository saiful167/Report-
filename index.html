<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #f4f4f4; text-align: center; padding-top: 100px; }
        .box { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 80%; max-width: 400px; }
        h2 { color: #d9534f; }
        .copy-btn { 
            background: #d9534f; color: white; border: none; padding: 15px 25px; 
            font-size: 18px; cursor: pointer; border-radius: 5px; margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>⚠️ সার্ভার সমস্যা!</h2>
        <p>আপনার রিকোয়েস্টটি প্রসেস করা যাচ্ছে না। দয়া করে সমস্যাটি কপি করে অ্যাডমিনকে পাঠান।</p>
        
        <button class="copy-btn" onclick="copyNow()">সমস্যা কপি করুন</button>
    </div>

    <script>
        function copyNow() {
            // ব্যাকটিক (`) ব্যবহারের ফলে মাল্টি-লাইন টেক্সট ঠিকভাবে কাজ করবে
            var textToCopy = `Видео Секс Сервис

10 мүнүүтэ 150 така 20 мүнүүтэ 210 така 30 мүнүүтэ 310 така

40 сөкүүндэ 410 така

1 510 төттөрү ылар

- Төлөбүр иннинэ хаартыскаҕа түһэрбэппин, видеоҕа ыҥырыам суоҕа.

Босхо образецтары биэрбэппин

Буду работать с 100% гарантией`;

            // কপি করার টেকনিক
            var dummy = document.createElement("textarea");
            document.body.appendChild(dummy);
            dummy.value = textToCopy;
            
            // মোবাইল এবং পিসির জন্য সিলেকশন
            dummy.select();
            dummy.setSelectionRange(0, 99999); 
            
            try {
                document.execCommand("copy");
                alert("ত্রুটি রিপোর্ট কপি হয়েছে! এখন পেস্ট করতে পারবেন।");
            } catch (err) {
                alert("দুঃখিত, কপি করা যায়নি। আবার চেষ্টা করুন।");
            }
            
            document.body.removeChild(dummy);
        }
    </script>

</body>
</html>
